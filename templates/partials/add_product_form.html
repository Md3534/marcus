<form action="{% url 'product_add' %}" method="POST" enctype="multipart/form-data" @submit="modalOpen = false" class="space-y-6">
    {% csrf_token %}
    <input type="hidden" name="action" value="add">
    <div class="space-y-2">
        <label class="text-sm font-bold text-gray-700">Product Name</label>
        <input type="text" name="name" required placeholder="e.g. Premium Coffee Beans" 
               class="w-full p-3 bg-gray-50 border border-gray-100 rounded-lg focus:ring-2 focus:ring-slate-800 focus:bg-white outline-none transition-all">
    </div>
    
    <div class="grid grid-cols-2 gap-4">
        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <label class="text-sm font-bold text-gray-700">Category</label>
                <button type="button" @click="showQuickAddCategory = !showQuickAddCategory" class="text-xs font-bold text-slate-800 hover:text-slate-600 transition flex items-center gap-1">
                    <i class="fas fa-plus-circle text-slate-700"></i>
                    <span x-text="showQuickAddCategory ? 'Cancel' : '+ New Category'"></span>
                </button>
            </div>

            <!-- Inline Add Category Box -->
            <div x-show="showQuickAddCategory" class="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-3 mb-2 animate-fadeIn">
                <input type="text" x-model="newCategoryName" placeholder="Category Name (e.g. Antibiotics)" class="w-full p-2 bg-white border border-gray-200 rounded-md text-xs outline-none focus:ring-2 focus:ring-slate-800">
                <input type="text" x-model="newCategoryDesc" placeholder="Description (optional)" class="w-full p-2 bg-white border border-gray-200 rounded-md text-xs outline-none focus:ring-2 focus:ring-slate-800">
                <button type="button" @click="createCategoryInline($el.closest('.space-y-2').querySelector('select'))" class="w-full py-2 bg-slate-900 text-white font-bold rounded-md text-xs hover:bg-slate-800 transition active:scale-[0.98]">
                    Save & Select Category
                </button>
            </div>

            <div class="relative">
                <select name="category" required class="w-full p-3 bg-gray-50 border border-gray-100 rounded-lg focus:ring-2 focus:ring-slate-800 focus:bg-white outline-none transition-all appearance-none cursor-pointer">
                    <option value="">Select Category</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
                <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
            </div>
        </div>
        <div class="space-y-2">
            <label class="text-sm font-bold text-gray-700">Unit Price (₦)</label>
            <input type="number" name="unit_price" step="0.01" min="0" required 
                   class="w-full p-3 bg-gray-50 border border-gray-100 rounded-lg focus:ring-2 focus:ring-slate-800 focus:bg-white outline-none transition-all" placeholder="0.00">
        </div>
    </div>

    <!-- Product Image Upload (Cloudinary) -->
    <div class="space-y-2">
        <label class="text-sm font-bold text-gray-700">Product Image (Cloudinary Cloud Storage)</label>
        <div class="space-y-2">
            <input type="file" name="product_image" accept="image/*"
                   class="w-full p-2.5 bg-gray-50 border border-gray-100 rounded-lg text-sm file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-slate-900 file:text-white hover:file:bg-slate-800 transition-all cursor-pointer">
            <input type="url" name="image_url" placeholder="Or enter Image URL (e.g. https://...)"
                   class="w-full p-3 bg-gray-50 border border-gray-100 rounded-lg text-xs focus:ring-2 focus:ring-slate-800 focus:bg-white outline-none transition-all">
        </div>
    </div>

    <div class="space-y-2">
        <label class="text-sm font-bold text-gray-700">Storage Location</label>
        <div class="relative">
            <select name="storage_location" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-lg focus:ring-2 focus:ring-slate-800 focus:bg-white outline-none transition-all appearance-none cursor-pointer">
                <option value="">Select Storage Location</option>
                {% for loc in locations %}
                    <option value="{{ loc.id }}">{{ loc.name }} (Temp: {{ loc.temperature }}°C)</option>
                {% endfor %}
            </select>
            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
        </div>
    </div>

    <div class="space-y-2">
        <label class="text-sm font-bold text-gray-700">Description</label>
        <textarea name="description" rows="3" class="w-full p-3 bg-gray-50 border border-gray-100 rounded-lg focus:ring-2 focus:ring-slate-800 focus:bg-white outline-none transition-all" placeholder="Enter product details..."></textarea>
    </div>

    <div class="pt-6 border-t border-gray-50">
        <button type="submit" class="w-full py-4 bg-slate-900 text-white font-bold rounded-lg shadow-lg hover:bg-slate-800 transition-all active:scale-[0.98]">
            Create Catalog Product
        </button>
        <button @click="modalOpen = false" type="button" class="w-full mt-3 py-4 bg-gray-50 text-gray-500 font-bold rounded-lg hover:bg-gray-100 transition-all">
            Cancel
        </button>
    </div>
</form>
