<form method="POST" action="{% url 'add_batch_standalone' %}" class="space-y-4">
    {% csrf_token %}
    <input type="hidden" name="next" :value="window.location.pathname">
    
    <!-- Target Product -->
    <div x-show="!editingProduct || !editingProduct.id">
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Product *</label>
        <select name="product_id" :disabled="editingProduct && editingProduct.id" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none" :required="modalType === 'add_batch' && (!editingProduct || !editingProduct.id)">
            <option value="">Select Product</option>
            {% for p in products %}
            <option value="{{ p.id }}" {% if product and product.id == p.id %}selected{% endif %}>{{ p.name }} (Stock: {{ p.stock }})</option>
            {% endfor %}
        </select>
    </div>
    
    <template x-if="editingProduct && editingProduct.id">
        <div>
            <input type="hidden" name="product_id" :value="editingProduct.id">
            <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm">
                <span class="text-xs text-gray-500 font-bold uppercase block">Target Product</span>
                <span class="font-bold text-slate-900" x-text="editingProduct.name"></span>
            </div>
        </div>
    </template>

    <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Batch Number</label>
        <input type="text" name="batch_number" placeholder="Auto-generated if left blank" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
        <p class="text-[11px] text-gray-400 mt-1">Example: BATCH-2026-001</p>
    </div>

    <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Quantity (Units) *</label>
        <input type="number" name="quantity" min="1" required placeholder="e.g. 50" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
    </div>

    <div class="grid grid-cols-2 gap-3">
        <div>
            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Production Date</label>
            <input type="date" name="production_date" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
        </div>
        <div>
            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Expiry Date</label>
            <input type="date" name="expiry_date" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
        </div>
    </div>

    <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Storage Location</label>
        <select name="storage_location" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
            <option value="">Select Location (Optional)</option>
            {% for loc in locations %}
            <option value="{{ loc.id }}">{{ loc.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="pt-4 flex justify-end gap-3 border-t">
        <button type="button" @click="modalOpen = false" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm font-semibold rounded-lg hover:bg-gray-200 transition-colors">Cancel</button>
        <button type="submit" class="px-5 py-2 bg-slate-900 text-white text-sm font-bold rounded-lg hover:bg-slate-800 transition-colors">Add Stock Batch</button>
    </div>
</form>
